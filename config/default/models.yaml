      - id: gpt-oss-120b
        type: llm
        name: GPT-OSS 120B
        owned_by: internal
        description: Open-source 120B parameter model.
        context_length: 131072
        capabilities: [tool_calling, json_mode, streaming]
        architecture:
          input_modalities: [text]
          output_modalities: [text]

