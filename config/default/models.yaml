providers:
  - id: openrouter
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: LLM_API_KEY
    # ssl_client_cert_env: OPENROUTER_CLIENT_CERT
    # ssl_client_key_env: OPENROUTER_CLIENT_KEY
    # ssl_client_key_password_env: OPENROUTER_CLIENT_KEY_PASSWORD
