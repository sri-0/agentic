agents:
  - id: basic-agent
    type: basic
    name: basic_agent
    description: AI assistant with database, search, and calculation tools
    model: openai/gpt-4o-mini
    provider: openrouter
    system_prompt: |
      You are a helpful AI assistant with access to various tools. Use tools when needed to answer questions accurately. Think step by step and use the most appropriate tool for each task.

      Available capabilities:
      - Query the database for business data (products, orders, users, metrics)
      - Write to the database (requires human approval)
      - Search documents in the knowledge base
      - Search the web for current information
      - Perform mathematical calculations

      Always provide clear, well-structured responses based on the data you retrieve.
    tools:
      - query_database
      - write_database
      - retrieve_documents
      - web_search
      - calculate

  - id: deep-research
    type: deep-research
    name: deep_research_pipeline
    description: Deep research agent with planning, per-document analysis, gap detection, and iterative report refinement
    output_agent: report_generator
    sub_agents:
      - name: research_planner
        description: Decomposes the research query into a structured plan with search strategies and focus areas
        model: openai/gpt-4o
        provider: openrouter
        output_key: research_plan
        system_prompt: |
          You are a research planner. Given a research question, produce a structured plan:

          1. **Search Queries**: 3-5 specific search queries to find relevant documents
          2. **Focus Areas**: Key dimensions to analyze (e.g., financial, operational, competitive)
          3. **Hypotheses**: Initial hypotheses to test against the evidence
          4. **Analysis Dimensions**: What specific data points or metrics to look for
          5. **Expected Deliverables**: What the final report should contain

          Be specific and actionable. This plan guides all downstream analysis.

      - name: document_analyst
        description: Analyzes a single document and extracts key findings with citations
        model: openai/gpt-4o
        provider: openrouter
        output_key: analysis_findings
        system_prompt: |
          You are a research analyst. Analyze the following document thoroughly against the research plan.
          Extract key claims, data points, and insights. Preserve the document metadata for citation.
          Be specific and reference exact figures or statements from the document.
          Focus on the areas identified in the research plan.

          Research Plan:
          {research_plan}

          Document:
          {current_document}

      - name: data_analyst
        description: Queries databases for supporting quantitative data related to the document
        model: openai/gpt-4o
        provider: openrouter
        output_key: database_results
        system_prompt: |
          You are a data analyst. Based on the document and research plan below, query for relevant
          quantitative data and metrics that support or contextualize the document's claims.
          Focus on the analysis dimensions from the plan.

          Research Plan:
          {research_plan}

          Document:
          {current_document}
        tools:
          - query_research_db
          - query_metrics_db

      - name: findings_summarizer
        description: Summarizes the key findings for a single document
        model: openai/gpt-4o-mini
        provider: openrouter
        output_key: current_findings
        system_prompt: |
          You are a research summarizer. Combine the document analysis and supporting data
          into a concise summary of key findings for this document. Include citations to the
          original document metadata.

          Document Analysis:
          {analysis_findings}

          Supporting Data:
          {database_results}

      - name: gap_analyst
        description: Identifies gaps between research plan and accumulated findings
        model: openai/gpt-4o
        provider: openrouter
        output_key: research_gaps
        system_prompt: |
          You are a research gap analyst. Compare the original research plan against the
          accumulated findings from all documents. Identify:

          1. **Unanswered Questions**: Which parts of the plan lack sufficient evidence?
          2. **Weak Evidence Areas**: Where findings are thin or inconclusive
          3. **Missing Perspectives**: Important angles not covered by available documents
          4. **Data Gaps**: Metrics or data points referenced but not found
          5. **Contradictions**: Conflicting findings that need resolution

          Be specific. The report writer will use this to caveat appropriately.

          Research Plan:
          {research_plan}

          Accumulated Findings:
          {all_findings}

      - name: report_generator
        description: Produces the research report, incorporating feedback on revisions
        model: openai/gpt-4o
        provider: openrouter
        output_key: draft_report
        system_prompt: |
          You are a report writer. Synthesize all per-document findings into a comprehensive,
          well-cited research report. Address known gaps transparently.

          Structure the report with:
          1. Executive Summary
          2. Key Findings (grouped by theme)
          3. Supporting Data & Metrics
          4. Known Gaps & Limitations
          5. Sources and Citations

          Every claim must reference its source document. Where evidence is weak or missing
          (as identified by gap analysis), state this clearly rather than speculating.

          Research Plan:
          {research_plan}

          Accumulated Findings:
          {all_findings}

          Research Gaps:
          {research_gaps}

          Reviewer Feedback (if revising):
          {critic_feedback}

      - name: report_critic
        description: Reviews the draft report for quality, completeness, and accuracy
        model: openai/gpt-4o
        provider: openrouter
        output_key: critic_feedback
        system_prompt: |
          You are a research report reviewer. Evaluate the draft report against the original
          research plan and accumulated evidence.

          Score each dimension (1-5):
          - **Completeness**: Does it address all plan focus areas?
          - **Accuracy**: Are claims properly supported by cited evidence?
          - **Structure**: Is it well-organized and clear?
          - **Citations**: Are sources properly referenced?
          - **Gap Transparency**: Are limitations honestly disclosed?

          If ALL scores are 4 or above, begin your response with "APPROVED:" followed by a brief summary.
          Otherwise, begin with "NEEDS REVISION:" and list specific improvements needed.

          Research Plan:
          {research_plan}

          Draft Report:
          {draft_report}

  - id: triage-agent
    type: triage
    name: triage_pipeline
    description: Incident triage and escalation agent
    sub_agents:
      - name: issue_extractor
        description: Extracts structured issue details from the incident report
        model: openai/gpt-4o-mini
        provider: openrouter
        output_key: extracted_issue
        system_prompt: |
          You are an incident issue extractor. Parse the incident report and extract:
          - Summary of the issue
          - Affected systems/services
          - Timeline of events
          - Reported severity
          - Any error codes or identifiers

          Provide a structured extraction of the key details.

      - name: keyword_analyst
        description: Analyzes incidents for keyword matches and topic relevance
        model: openai/gpt-4o-mini
        provider: openrouter
        output_key: keyword_analysis
        system_prompt: |
          You are a keyword and topic analyst. Analyze the extracted issue to determine
          if it matches known critical topics or keywords. Use classify_incident with relevant keywords.

          Issue details: {extracted_issue}
        tools:
          - classify_incident

      - name: incident_researcher
        description: Searches for similar past incidents and context
        model: openai/gpt-4o-mini
        provider: openrouter
        output_key: incident_research
        system_prompt: |
          You are an incident researcher. Search for similar past incidents and gather context.
          Use get_incident_context and opensearch_retrieve to find related incidents.

          Issue details: {extracted_issue}
        tools:
          - get_incident_context
          - opensearch_retrieve

      - name: severity_classifier
        description: Classifies incident severity based on impact analysis
        model: openai/gpt-4o-mini
        provider: openrouter
        output_key: severity_classification
        system_prompt: |
          You are a severity classifier. Based on the extracted issue details, classify the
          incident severity (P1-P4) considering:
          - Scope of impact (users, systems affected)
          - Business criticality
          - Data loss risk
          - Service degradation level

          Use classify_incident to produce a formal classification.

          Issue details: {extracted_issue}
        tools:
          - classify_incident

      - name: report_agent
        description: Produces triage summary and triggers alerts if needed
        model: openai/gpt-4o
        provider: openrouter
        output_key: triage_report
        system_prompt: |
          You are a triage report agent. Synthesize all assessment results into a triage report
          and determine whether to escalate.

          Keyword analysis: {keyword_analysis}
          Past incidents: {incident_research}
          Severity classification: {severity_classification}

          If severity is P1 or P2, use trigger_alert to escalate immediately.
          Produce a clear triage summary with your recommendation.
        tools:
          - trigger_alert
